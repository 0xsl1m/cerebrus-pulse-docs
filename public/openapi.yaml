  /arb:
    get:
      summary: Market Stress Index from cross-chain arbitrage scans
      description: >-
        Market Stress Index from cross-chain arbitrage scans.


        Paid endpoint: 0.02 USDC per call via x402 v2 (Base or Solana). Returns 402 with payment terms if unpaid.
        Reference: https://cerebruspulse.xyz/api/arb
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          description: 1-50 (default 10)
      responses:
        '200':
          description: Analysis result. The settlement receipt is in the PAYMENT-RESPONSE header.
          headers:
            PAYMENT-RESPONSE:
              description: base64 x402 settlement receipt
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
        '400':
          description: >-
            Invalid input (bad symbol, timeframe or integer parameter), refused before any price is quoted; or the
            engine could not serve the request (not charged).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: Payment required. x402 v2 terms are in the PAYMENT-REQUIRED header; retry with PAYMENT-SIGNATURE.
          headers:
            PAYMENT-REQUIRED:
              description: base64 x402 v2 payment terms
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: >-
            Service disabled, payment system unavailable, or the upstream data feed is missing or stale. No price is
            quoted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Analysis timed out (not charged).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-price-usd: 0.02
      x-payment-protocol: x402
